name: cmake-linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        compiler:
          - { cpp_compiler: g++, c_compiler: gcc}
          - { cpp_compiler: clang++, c_compiler: clang}

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: "Install Package Dependencies (Ubuntu)"
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential uuid-dev
        # cmake ninja-build

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -D CMAKE_CXX_COMPILER=${{ matrix.compiler.cpp_compiler }}
        -D CMAKE_C_COMPILER=${{ matrix.compiler.c_compiler }}
        -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

  python-bindings:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential uuid-dev

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Create venv and install tooling
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install scikit-build-core pybind11 ninja numpy pybind11-stubgen trimesh

    - name: Configure CMake with Python bindings
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DLCS_BUILD_PYBINDINGS=ON \
          -DLCS_PYTHON_EXECUTABLE="$(pwd)/.venv/bin/python" \
          -S ${{ github.workspace }}

    - name: Build + stubs
      run: cmake --build build -j --target stubs

    - name: Editable install
      run: |
        source .venv/bin/activate
        pip install -e .

    - name: Run Python bindings test
      run: |
        source .venv/bin/activate
        python PythonBindings/tests/test_rigid_joint_animation.py --headless --advance_frames 30
