name: cmake-linux

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        compiler:
          - { cpp_compiler: g++, c_compiler: gcc, python_bindings: true }
          - { cpp_compiler: clang++, c_compiler: clang, python_bindings: false }

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install Package Dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential uuid-dev

      - name: Setup Python
        if: matrix.compiler.python_bindings
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install tooling
        if: matrix.compiler.python_bindings
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip3 install --upgrade pip
          pip3 install scikit-build-core pybind11 ninja numpy pybind11-stubgen trimesh

      - name: Configure CMake (with Python bindings)
        if: matrix.compiler.python_bindings
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.compiler.cpp_compiler }} \
            -D CMAKE_C_COMPILER=${{ matrix.compiler.c_compiler }} \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D LCS_BUILD_PYBINDINGS=ON \
            -D LCS_PYTHON_EXECUTABLE=${{ github.workspace }}/.venv/bin/python \
            -S ${{ github.workspace }}

      - name: Configure CMake
        if: ${{ !matrix.compiler.python_bindings }}
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.compiler.cpp_compiler }} \
            -D CMAKE_C_COMPILER=${{ matrix.compiler.c_compiler }} \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D LCS_BUILD_PYBINDINGS=OFF \
            -S ${{ github.workspace }}

      - name: Build stubs
        if: matrix.compiler.python_bindings
        # Limit parallelism: full -j on the 7 GB Ubuntu runner OOM-kills the LuisaCompute XIR build (exit 143).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} -j 2 --config ${{ matrix.build_type }} --target stubs

      - name: Build
        if: ${{ !matrix.compiler.python_bindings }}
        # Limit parallelism: full -j on the 7 GB Ubuntu runner OOM-kills the LuisaCompute XIR build (exit 143).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} -j 2 --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

      - name: Editable install
        if: matrix.compiler.python_bindings
        run: |
          source .venv/bin/activate
          pip3 install -e . --no-build-isolation

      - name: Run Python bindings test
        if: matrix.compiler.python_bindings
        run: |
          source .venv/bin/activate
          python PythonBindings/tests/test_rigid_joint_animation.py --headless --advance_frames 30
