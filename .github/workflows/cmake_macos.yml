name: cmake-macos

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        build_type: [Release]
        compiler:
          - { cpp_compiler: clang++, c_compiler: clang, python_bindings: true }

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install ccache
        run: brew install ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-clang-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-macos-clang-${{ github.ref_name }}-
            ccache-macos-clang-main-

      - name: Configure ccache
        run: |
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=500M
          ccache --zero-stats

      - name: Setup Python
        if: matrix.compiler.python_bindings
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install tooling
        if: matrix.compiler.python_bindings
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip3 install --upgrade pip
          pip3 install scikit-build-core pybind11 ninja numpy pybind11-stubgen trimesh

      - name: Configure CMake (with Python bindings)
        if: matrix.compiler.python_bindings
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.compiler.cpp_compiler }} \
            -D CMAKE_C_COMPILER=${{ matrix.compiler.c_compiler }} \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D LCS_BUILD_PYBINDINGS=ON \
            -D LCS_PYTHON_EXECUTABLE=${{ github.workspace }}/.venv/bin/python \
            -S ${{ github.workspace }}

      - name: Configure CMake
        if: ${{ !matrix.compiler.python_bindings }}
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.compiler.cpp_compiler }} \
            -D CMAKE_C_COMPILER=${{ matrix.compiler.c_compiler }} \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D LCS_BUILD_PYBINDINGS=OFF \
            -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Build stubs
        if: matrix.compiler.python_bindings
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target stubs

      - name: ccache stats
        run: ccache -s

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

      - name: Editable install
        if: matrix.compiler.python_bindings
        run: |
          source .venv/bin/activate
          pip3 install -e . --no-build-isolation

      - name: Verify import
        if: matrix.compiler.python_bindings
        run: |
          source .venv/bin/activate
          python -c "import lcs_py; print('lcs_py imported successfully')"
